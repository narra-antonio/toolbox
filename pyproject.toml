[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "toolbox"
version = "0.1.0"
description = "A cross-platform CLI + Web UI for managing multiple Git repositories"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [
    { name = "Antonio Narra", email = "antonio@antonionarra.io" }
]
dependencies = [
    "click>=8.1",
    "gitpython>=3.1",
    "flask>=3.0",
    "pystray>=0.19",
    "rumps>=0.4",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
toolbox = "toolbox.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["toolbox*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
